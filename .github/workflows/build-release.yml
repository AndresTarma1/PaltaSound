name: Build & Release

# Disparadores:
#   - push de un tag v*  (ej: v0.7.1)  -> compila instaladores y crea el GitHub Release
#   - workflow_dispatch               -> compila instaladores como artefactos (sin release)
#
# IMPORTANTE: el tag DEBE ser `v{packageVersion}` de desktopApp/build.gradle.kts (ej: tag v0.7.1
# para packageVersion 0.7.1). El updater de la app descarga el instalador desde
#   https://github.com/AndresTarma1/PaltaSound/releases/download/v<version>/<archivo>
# así que tag y versión tienen que coincidir exactamente (el job `release` lo valida).
#
# Los instaladores de Windows se compilan como binario GraalVM nativo (sin JVM) con la tarea
# packageGraalvmNsis. En Linux se usa la distribución JVM (packageDistributionForCurrentOS):
# el native-image de GraalVM falla en runners de GitHub (memoria) y Linux queda en alpha.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.dist_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_name: windows
            # yt-dlp solo se empaqueta en Windows (en Linux se usa el del sistema).
            needs_yt_dlp: true
            python_cmd: python
            # JVM (no GraalVM): el native-image falla con ForceOnModulePath de truffle-runtime.
            gradle_tasks: ":desktopApp:packageDistributionForCurrentOS"
            rustypipe_url: "https://codeberg.org/ThetaDev/rustypipe-botguard/releases/download/v0.1.2/rustypipe-botguard-v0.1.2-x86_64-pc-windows-msvc.zip"
            rustypipe_bin: "mpv-resources/windows/rustypipe-botguard.exe"
          - os: ubuntu-latest
            dist_name: linux
            needs_yt_dlp: false
            python_cmd: python3
            gradle_tasks: ":desktopApp:packageDistributionForCurrentOS"
            rustypipe_url: "https://codeberg.org/ThetaDev/rustypipe-botguard/releases/download/v0.1.2/rustypipe-botguard-v0.1.2-x86_64-unknown-linux-gnu.tar.xz"
            rustypipe_bin: "mpv-resources/linux/rustypipe-botguard"
    steps:
      - name: Checkout (con Git LFS para libmpv-2.dll)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Verify libmpv LFS asset
        if: matrix.needs_yt_dlp
        shell: pwsh
        run: |
          $file = "mpv-resources/windows/libmpv-2.dll"
          if (!(Test-Path -LiteralPath $file)) {
            throw "Missing $file after checkout"
          }
          $size = (Get-Item -LiteralPath $file).Length
          if ($size -lt 100000000) {
            throw "$file is only $size bytes; Git LFS pointer was not materialized"
          }
          Write-Host ("{0}: {1} bytes" -f $file, $size)

      - name: Download latest yt-dlp
        if: matrix.needs_yt_dlp
        shell: bash
        run: |
          set -eux
          mkdir -p mpv-resources/windows
          curl -fL -o mpv-resources/windows/yt-dlp.exe \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          ls -lh mpv-resources/windows/

      - name: Download rustypipe-botguard
        shell: bash
        run: |
          set -eux
          mkdir -p $(dirname "${{ matrix.rustypipe_bin }}")
          rm -rf /tmp/rustypipe
          mkdir -p /tmp/rustypipe
          if [[ "${{ matrix.rustypipe_url }}" == *.zip ]]; then
            curl -fL -o /tmp/rustypipe.zip "${{ matrix.rustypipe_url }}"
            unzip -o /tmp/rustypipe.zip -d /tmp/rustypipe
            ls -R /tmp/rustypipe | head -30
            find /tmp/rustypipe -name "rustypipe-botguard*" -type f -exec cp {} "${{ matrix.rustypipe_bin }}" \;
          else
            curl -fL -o /tmp/rustypipe.tar.xz "${{ matrix.rustypipe_url }}"
            tar -tf /tmp/rustypipe.tar.xz | head -20
            tar -xf /tmp/rustypipe.tar.xz -C /tmp/rustypipe
            ls -R /tmp/rustypipe | head -30
            find /tmp/rustypipe -name "rustypipe-botguard*" -type f -exec cp {} "${{ matrix.rustypipe_bin }}" \;
            chmod +x "${{ matrix.rustypipe_bin }}"
          fi
          ls -lh "${{ matrix.rustypipe_bin }}"
          file "${{ matrix.rustypipe_bin }}" || true

      - name: Build installers (${{ matrix.dist_name }})
        shell: bash
        run: |
          ./gradlew ${{ matrix.gradle_tasks }} --stacktrace

      - name: Verify GraalVM runtime resources
        if: matrix.needs_yt_dlp
        shell: pwsh
        run: |
          $file = "desktopApp/build/compose/binaries/main/graalvm-app/PaltaSound/libmpv-2.dll"
          if (!(Test-Path -LiteralPath $file)) {
            throw "GraalVM app-image does not contain libmpv-2.dll"
          }
          $size = (Get-Item -LiteralPath $file).Length
          if ($size -lt 100000000) {
            throw "GraalVM app-image contains an invalid libmpv-2.dll ($size bytes)"
          }
          Write-Host ("{0}: {1} bytes" -f $file, $size)

      - name: Verify rustypipe-botguard
        shell: bash
        run: |
          set -e
          if [ ! -f "${{ matrix.rustypipe_bin }}" ]; then
            echo "::error::Missing ${{ matrix.rustypipe_bin }} after download"
            exit 1
          fi
          ls -lh "${{ matrix.rustypipe_bin }}"
          if [[ "${{ matrix.dist_name }}" == "windows" ]]; then
            file="desktopApp/build/compose/binaries/main/graalvm-app/PaltaSound/rustypipe-botguard.exe"
            if [ ! -f "$file" ]; then
              echo "::error::GraalVM app-image does not contain rustypipe-botguard.exe"
              exit 1
            fi
            ls -lh "$file"
            # Linux binary should also be present in the JVM distribution resources if built, but we only verify Windows GraalVM here
          fi

      - name: Stage installers and merge update YAMLs
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          # Une los manifests latest*.yml (en Windows solo existe latest.yml para el NSIS;
          # en Linux solo existe latest-linux.yml) y copia a dist/ exactamente los archivos
          # que referencia cada manifest (instaladores + blockmaps), evitando arrastrar
          # binarios del app-image (launcher .exe, java.exe, yt-dlp empaquetado, ...).
          ${{ matrix.python_cmd }} .github/scripts/merge-update-yml.py desktopApp/build/compose/binaries dist --copy
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.dist_name }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v4

      - name: Download artifacts (windows + linux)
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Validate tag matches package version
        shell: bash
        run: |
          set -eu
          yml_version=$(grep -m1 '^version:' release/latest.yml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          echo "latest.yml version: $yml_version"
          echo "git tag:            ${{ github.ref_name }}"
          if [ "v$yml_version" != "${{ github.ref_name }}" ]; then
            echo "::error::El tag ${{ github.ref_name }} no coincide con la version de latest.yml (v$yml_version)."
            echo "::error::El updater descarga desde .../releases/download/v<version>/..., asi que el tag DEBE ser v{packageVersion} de desktopApp/build.gradle.kts."
            exit 1
          fi

      - name: Extract changelog section for this version
        shell: bash
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          python3 - "$VER" CHANGELOG.md release-notes.md <<'PY'
          import re, sys
          ver, changelog, out = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(changelog, encoding="utf-8").read()
          pat = re.compile(r'^##\s+\[?' + re.escape(ver) + r'\]?(?:\s+-.*)?$', re.M)
          m = pat.search(text)
          if not m:
              print(f"::error::No section for version {ver} found in {changelog}. "
                    f"Add '## [{ver}] - YYYY-MM-DD' to CHANGELOG.md before tagging.")
              sys.exit(1)
          start = m.end()
          nxt = re.search(r'^##\s', text[start:], re.M)
          section = text[start:nxt.start()+start] if nxt else text[start:]
          open(out, "w", encoding="utf-8").write(section.strip("\n") + "\n")
          PY
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
